<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Harrison's Equation of the Day</title>
        <link rel="preload" href="assets/fonts/Henny_Penny/HennyPenny-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <div id="card">
            <h1 id="title">Harrison's Equation of the Day</h1>
            <div id="equation">
                <math display="block">
                    <mover>
                        <mi mathvariant="normal" style="font-weight: bold;">a</mi>
                        <mo>→</mo>
                    </mover>
                    <mo>=</mo>
                    <mfrac>
                        <mrow>
                            <mo form="prefix" lspace="0.16666666666666666em" rspace="0">D</mo>
                            <mover>
                                <mi mathvariant="normal" style="font-weight: bold;">V</mi>
                                <mo>→</mo>
                            </mover>
                        </mrow>
                        <mrow>
                            <mo form="prefix" lspace="0.16666666666666666em" rspace="0">D</mo>
                            <mi>t</mi>
                        </mrow>
                    </mfrac>
                    <mo>=</mo>
                    <mfrac>
                        <mrow>
                            <mo>∂</mo>
                            <mover>
                                <mi mathvariant="normal" style="font-weight: bold;">V</mi>
                                <mo>→</mo>
                            </mover>
                        </mrow>
                        <mrow>
                            <mo>∂</mo>
                            <mi>t</mi>
                        </mrow>
                    </mfrac>
                    <mo>+</mo>
                    <mo>(</mo>
                    <mover>
                        <mi mathvariant="normal" style="font-weight: bold;">V</mi>
                        <mo>→</mo>
                    </mover>
                    <mo>⋅</mo>
                    <mo>∇</mo>
                    <mo>)</mo>
                    <mover>
                        <mi mathvariant="normal" style="font-weight: bold;">V</mi>
                        <mo>→</mo>
                    </mover>
                </math>
            </div>
        </div>
    </body>
</html>
